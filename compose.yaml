services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    ports:
      - "8000:80"
    environment:
      APP_KEY: ${APP_KEY}
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-instaclone}
      DB_USERNAME: ${DB_USERNAME:-instaclone}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      FILESYSTEM_DISK: public
      MERCURE_URL: http://localhost/.well-known/mercure
      MERCURE_JWT_SECRET: ${MERCURE_JWT_SECRET:-supersecret}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-instaclone}
      MYSQL_USER: ${DB_USERNAME:-instaclone}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $${DB_USERNAME:-instaclone} -p$${DB_PASSWORD:-secret} --silent"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../instaclone-frontend
      args:
        VITE_API_URL: http://localhost:8000/api
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - app

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

volumes:
  mysql_data:
  minio_data:
